name: Release

# Releases are tag driven. The tag must be a unique semantic version whose
# commit already carries a successful million-cell status, and an existing
# version tag in the registry is never overwritten.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  # GitHub Container Registry is used because this repository is public and
  # GitHub currently states that Container Registry storage and bandwidth are
  # free for public packages. Reassess if that billing changes:
  # https://docs.github.com/en/billing/concepts/product-billing/github-packages
  IMAGE_NAME: ${{ github.repository }}
  MILLION_CELL_CONTEXT: acceptance/million-cell

jobs:
  guard:
    name: Verify the release preconditions
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Resolve and validate the version
        id: version
        run: |
          version="${GITHUB_REF_NAME}"
          if ! printf '%s' "$version" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "tag $version is not a semantic version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "releasing $version from ${GITHUB_SHA}"

      - name: Require a successful million-cell status for this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/status" \
            --jq ".statuses[] | select(.context == \"${MILLION_CELL_CONTEXT}\") | .state" | head -1)
          if [ "$state" != "success" ]; then
            echo "commit ${GITHUB_SHA} has million-cell status '${state:-none}'."
            echo "Run the 'Million-cell gate' workflow against this commit before releasing."
            exit 1
          fi
          echo "million-cell gate passed for ${GITHUB_SHA}"

      - name: Refuse to overwrite an existing version tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ steps.version.outputs.version }}"
          repository_name="${GITHUB_REPOSITORY##*/}"
          owner_type=$(gh api "users/${GITHUB_REPOSITORY_OWNER}" --jq .type)
          if [ "$owner_type" = "Organization" ]; then
            endpoint="orgs/${GITHUB_REPOSITORY_OWNER}/packages/container/${repository_name}/versions"
          else
            endpoint="users/${GITHUB_REPOSITORY_OWNER}/packages/container/${repository_name}/versions"
          fi
          existing=$(gh api --paginate "$endpoint" \
            --jq "[.[] | select(.metadata.container.tags[]? == \"${version}\")] | length" 2>/dev/null | \
            awk '{ total += $1 } END { print total + 0 }')
          if [ "${existing:-0}" != "0" ]; then
            echo "the registry already publishes ${version}; version tags are immutable"
            exit 1
          fi
          echo "${version} is not published yet"

  publish:
    name: Build and publish multi-architecture images
    runs-on: ubuntu-latest
    needs: guard
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive the image tags
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Immutable version and commit tags only; no moving "latest".
          tags: |
            type=semver,pattern={{version}}
            type=sha,format=long,prefix=sha-

      - name: Build and push
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.guard.outputs.version }}
          provenance: mode=max
          sbom: true

      - name: Attest the published image
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Record the release
        run: |
          {
            echo "## Release ${{ needs.guard.outputs.version }}"
            echo
            echo "| field | value |"
            echo "|---|---|"
            echo "| commit | \`${GITHUB_SHA}\` |"
            echo "| digest | \`${{ steps.push.outputs.digest }}\` |"
            echo "| platforms | linux/amd64, linux/arm64 |"
            echo
            echo "Tags:"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo
            echo "Deploy by digest:"
            echo '```'
            echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}"
            echo '```'
            echo
            echo "Rollout order: run \`/app/migrate\`, roll out \`/app/api\`, verify \`/health\`,"
            echo "then run the authenticated read and create/query/delete smoke tests."
          } >> "$GITHUB_STEP_SUMMARY"
